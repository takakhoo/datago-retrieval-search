[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "datago"
version = "2.0.0"
description = "Gated deep search and search memory on top of KataGo"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
experiments = ["scikit-learn>=1.4", "matplotlib>=3.8", "scipy>=1.11"]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["datago"]

[tool.pytest.ini_options]
testpaths = ["tests"]
