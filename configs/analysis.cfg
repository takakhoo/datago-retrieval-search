# KataGo analysis-engine settings shared by every player in every experiment.
# One search thread per query keeps searches free of virtual-loss effects, so
# a visit means the same thing at every budget. Throughput comes from running
# many queries at once.
logDir = /tmp/mikiri-katago-logs
logAllRequests = false
logAllResponses = false
logSearchInfo = false

reportAnalysisWinratesAs = BLACK
analysisPVLen = 10

numAnalysisThreads = 64
numSearchThreadsPerAnalysisThread = 1
nnMaxBatchSize = 64
nnCacheSizePowerOfTwo = 24
nnMutexPoolSizePowerOfTwo = 17
nnRandomize = true
numNNServerThreadsPerModel = 1

# The analysis engine widens the root by default, which weakens play.
wideRootNoise = 0.0
